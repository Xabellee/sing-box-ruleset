name: Daily Release

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00，可按需调整
  workflow_dispatch:        # 允许手动触发，方便调试

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 发布 Release 需要写权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run program
        run: go run main.go   # 程序执行后会生成输出文件

      - name: Create release tag
        id: tag
        run: |
          TAG="release-$(date -u '+%Y%m%d')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Daily release ${{ steps.tag.outputs.tag }}"
          files: "*.srs"
